<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/error-log.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<title>Admin · Clarity Journal</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div class="app" id="app" data-state="booting">
    <!-- collapse the sidebar before the first paint if it was left collapsed, so it doesn't flash open -->
    <script>try{ if(localStorage.getItem('cj-admin-sidebar') === 'collapsed') document.getElementById('app').classList.add('collapsed'); }catch(e){}</script>
    <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
      <div class="sidebar-head">
        <a class="brand" href="#/dashboard">
          <img src="/logo-mark.png?v=3" alt="" width="28" height="28">
          <span class="brand-text">
            <span class="brand-name">Clarity Journal</span>
            <span class="brand-sub">Admin</span>
          </span>
        </a>
        <button class="icon-btn collapse-btn" id="collapseBtn" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar"><span class="i" data-icon="panelLeft"></span></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="me-btn" id="meBtn" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar sm" id="meAvatar"></span>
          <span class="me-text">
            <span class="me-name" id="meName">…</span>
            <span class="me-role" id="meRole"></span>
          </span>
          <span class="i" data-icon="chevronsUpDown"></span>
        </button>
        <button class="nav-item signout" id="signOutBtn">
          <span class="i" data-icon="logOut"></span><span>Sign out</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <div class="demo-banner" id="demoBanner" hidden>
        <span class="i" data-icon="info"></span>
        Demo data. Nothing you do here is saved or sent anywhere.
      </div>
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"><span class="i" data-icon="menu"></span></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-actions">
          <button class="search-btn" id="searchBtn" aria-label="Search">
            <span class="i" data-icon="search"></span>
            <span class="search-btn-label">Search users, pages…</span>
            <kbd id="searchKbd">Ctrl K</kbd>
          </button>
          <button class="icon-btn" id="notifBtn" aria-label="Notifications" aria-haspopup="dialog" data-tip="Notifications">
            <span class="i" data-icon="bell"></span><span class="dot" id="notifDot" hidden></span>
          </button>
          <button class="avatar-btn" id="topAvatarBtn" aria-label="Account menu" aria-haspopup="menu">
            <span class="avatar sm" id="topAvatar"></span>
          </button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>
  <div id="layer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha256-WdOUh8NYmEO0EDItij1WLOAiq6HlzLFomO8/sqDaLs0=" crossorigin="anonymous"></script>
  <script src="/shared-auth.js"></script>
  <script src="/admin-icons.js"></script>
  <script src="/admin-charts.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
