<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Clarity Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080A10; --panel:#12151C; --panel-2:#171B24; --line:#232836;
    --ink:#EBEDF3; --ink-soft:#8A90A3; --ink-faint:#565C6E;
    --green:#00D9A3; --red:#FF4D6A; --amber:#FFB020;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:34px 30px 28px;
  }
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:26px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg,var(--green),#00A8FF);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 22px -4px rgba(0,217,163,.55);
  }
  .brand-mark svg{width:21px; height:21px;}
  .brand span{font-family:'Sora',sans-serif; font-weight:700; font-size:17px;}
  h1{font-family:'Sora',sans-serif; font-size:20px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:13px; margin:0 0 22px;}
  label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  input{
    width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 13px;
    border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); margin-bottom:16px;
  }
  input:focus{outline:2px solid var(--green); outline-offset:1px;}
  button{
    width:100%; border:none; border-radius:10px; padding:12px; font-family:'Inter',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; color:#03130E;
    background:linear-gradient(135deg,var(--green),#00B589); box-shadow:0 8px 20px -6px rgba(0,217,163,.5);
  }
  button:disabled{opacity:.6; cursor:default;}
  .msg{
    font-size:13px; border-radius:10px; padding:11px 13px; margin-bottom:16px; display:none; line-height:1.45;
  }
  .msg.show{display:block;}
  .msg.err{background:rgba(255,77,106,.12); border:1px solid rgba(255,77,106,.35); color:var(--red);}
  .msg.warn{background:rgba(255,176,32,.12); border:1px solid rgba(255,176,32,.35); color:var(--amber);}
  .foot{margin-top:20px; text-align:center; font-size:12px; color:var(--ink-faint); line-height:1.5;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 17L9 10L13 14L20 5" stroke="#03130E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 5H20V10" stroke="#03130E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span>Clarity Journal</span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Access is invite-only. Enter the credentials for your approved account.</p>

    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>

    <div class="foot">Need an account? Ask your admin to invite you —<br>there is no public sign-up.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    function showMsg(text, kind){ msg.textContent = text; msg.className = 'msg show ' + kind; }

    // If a guard bounced us here because the account isn't approved, explain why.
    const params = new URLSearchParams(location.search);
    const state = params.get('state');
    if(state === 'pending'){
      showMsg('Your account has been created but is awaiting admin approval. You’ll be able to sign in once it’s approved.', 'warn');
    } else if(state === 'disabled'){
      showMsg('This account has been deactivated. Contact your admin if you think this is a mistake.', 'warn');
    }

    // Already signed in and approved? Skip the form.
    (async () => {
      const profile = await getMyProfile();
      if(profile && profile.status === 'approved'){
        window.location.replace(profile.role === 'admin' ? '/admin' : '/');
      }
    })();

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('submitBtn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      msg.className = 'msg';

      const email = $('email').value.trim();
      const password = $('password').value;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        showMsg('Incorrect email or password.', 'err');
        btn.disabled = false; btn.textContent = 'Sign in';
        return;
      }

      // Signed in — now check approval status before letting them through.
      const profile = await getMyProfile();
      if(!profile){
        showMsg('Could not load your account. Please try again.', 'err');
        await sb.auth.signOut();
        btn.disabled = false; btn.textContent = 'Sign in';
        return;
      }
      if(profile.status === 'pending'){
        await sb.auth.signOut();
        showMsg('Your account is awaiting admin approval.', 'warn');
        btn.disabled = false; btn.textContent = 'Sign in';
        return;
      }
      if(profile.status === 'disabled'){
        await sb.auth.signOut();
        showMsg('This account has been deactivated.', 'warn');
        btn.disabled = false; btn.textContent = 'Sign in';
        return;
      }
      // approved
      window.location.replace(profile.role === 'admin' ? '/admin' : '/');
    });
  </script>
</body>
</html>
