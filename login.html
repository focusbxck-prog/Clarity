<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Clarity Journal</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080A10; --panel:#12151C; --panel-2:#171B24; --line:#232836;
    --ink:#EBEDF3; --ink-soft:#8A90A3; --ink-faint:#565C6E;
    --green:#00D9A3; --red:#FF4D6A; --amber:#FFB020;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:34px 30px 28px;}
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:26px;}
  .brand-mark{width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:transparent; overflow:hidden;
    display:flex; align-items:center; justify-content:center;}
  .brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand span{font-family:'Sora',sans-serif; font-weight:700; font-size:17px;}
  h1{font-family:'Sora',sans-serif; font-size:20px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:13px; margin:0 0 22px;}
  label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  input{width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 13px;
    border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); margin-bottom:16px;}
  input:focus{outline:2px solid var(--green); outline-offset:1px;}
  button{width:100%; border:none; border-radius:10px; padding:12px; font-family:'Inter',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; color:#03130E;
    background:linear-gradient(135deg,var(--green),#00B589); box-shadow:0 8px 20px -6px rgba(0,217,163,.5);}
  button:disabled{opacity:.6; cursor:default;}
  .msg{font-size:13px; border-radius:10px; padding:11px 13px; margin-bottom:16px; display:none; line-height:1.5;}
  .msg.show{display:block;}
  .msg.err{background:rgba(255,77,106,.12); border:1px solid rgba(255,77,106,.35); color:var(--red);}
  .msg.warn{background:rgba(255,176,32,.12); border:1px solid rgba(255,176,32,.35); color:var(--amber);}
  .foot{margin-top:20px; text-align:center; font-size:12.5px; color:var(--ink-faint);}
  .foot a{color:var(--green); text-decoration:none; font-weight:600;}
  .foot a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <img src="logo-mark.png" alt="Clarity Journal logo">
      </div>
      <span>Clarity Journal</span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Enter your username and password.</p>

    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>

    <div class="foot">Don&rsquo;t have an account? <a href="/signup">Create one</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    function showMsg(t,k){ msg.textContent = t; msg.className = 'msg show ' + k; }

    const state = new URLSearchParams(location.search).get('state');
    if(state === 'pending'){
      showMsg('Your account is still awaiting admin approval. You will be able to sign in once it is approved.', 'warn');
    } else if(state === 'disabled'){
      showMsg('This account has been deactivated. Contact your admin if you think this is a mistake.', 'warn');
    }

    (async () => {
      const profile = await getMyProfile();
      if(profile && profile.status === 'approved'){
        window.location.replace(profile.role === 'admin' ? '/admin' : '/');
      }
    })();

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('submitBtn');
      const username = $('username').value.trim();
      const password = $('password').value;
      msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Signing in...';

      const fail = (text, kind) => {
        showMsg(text, kind || 'err');
        btn.disabled = false; btn.textContent = 'Sign in';
      };

      // 1. username -> email (Supabase authenticates by email)
      let email = null;
      try{
        const { data, error } = await sb.rpc('email_for_username', { p_username: username });
        if(error) throw error;
        email = data;
      }catch(err){
        return fail('Could not reach the server. Please try again.');
      }
      // same wording as a bad password, so this cannot be used to discover usernames
      if(!email) return fail('Incorrect username or password.');

      // 2. sign in
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) return fail('Incorrect username or password.');

      // 3. approval gate
      const profile = await getMyProfile();
      if(!profile){ await sb.auth.signOut(); return fail('Could not load your account. Please try again.'); }
      if(profile.status === 'pending'){
        await sb.auth.signOut();
        return fail('Your account is still awaiting admin approval.', 'warn');
      }
      if(profile.status === 'disabled'){
        await sb.auth.signOut();
        return fail('This account has been deactivated.', 'warn');
      }

      window.location.replace(profile.role === 'admin' ? '/admin' : '/');
    });
  </script>
</body>
</html>
