<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Clarity Journal</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Clarity Journal is a trading journal: log your trades, review your stats, and track prop firm costs, payouts and taxes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080A10; --panel:#12151C; --panel-2:#171B24; --line:rgba(125,211,252,0.5);
    --ink:#EBEDF3; --ink-soft:#8A90A3; --ink-faint:#7A8195;
    --green:#00D9A3; --red:#FF4D6A; --amber:#FFB020;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:20px;
    /* deep space with soft nebula glows */
    background:
      radial-gradient(1100px 680px at 12% 8%, rgba(139,124,255,.18), transparent 60%),
      radial-gradient(900px 620px at 88% 88%, rgba(0,168,255,.15), transparent 60%),
      radial-gradient(640px 460px at 72% 18%, rgba(0,217,163,.08), transparent 60%),
      #04050A;}

  /* space scene: canvas starfield, a planet rising from the corner, a small moon */
  #stars{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;}
  .planet{position:fixed; z-index:0; pointer-events:none; width:560px; height:560px; border-radius:50%;
    left:-200px; bottom:-300px;
    background:radial-gradient(circle at 62% 28%, #33487a 0%, #18223f 42%, #0a0e1c 72%, #05070e 100%);
    box-shadow:0 0 90px 12px rgba(56,189,248,.16), inset 14px 14px 46px rgba(125,211,252,.22), inset -40px -30px 70px rgba(0,0,0,.65);}
  .planet::after{content:""; position:absolute; inset:0; border-radius:50%;
    background:repeating-linear-gradient(-24deg, transparent 0 34px, rgba(125,211,252,.022) 34px 52px); mix-blend-mode:screen;}
  .moon{position:fixed; z-index:0; pointer-events:none; width:74px; height:74px; border-radius:50%;
    right:11%; top:11%; opacity:.9;
    background:radial-gradient(circle at 34% 32%, #e3e9f3 0%, #9aa3b6 38%, #4a5163 70%, #232734 100%);
    box-shadow:0 0 34px rgba(210,222,240,.22), inset -10px -8px 18px rgba(0,0,0,.5);}
  @media (max-width:600px){
    .planet{width:380px; height:380px; left:-180px; bottom:-220px;}
    .moon{width:46px; height:46px; right:8%; top:6%;}
  }

  .card{position:relative; z-index:1; width:100%; max-width:400px; border:1px solid var(--line);
    border-radius:18px; padding:34px 30px 28px;
    background:rgba(18,21,28,.84); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.85);}
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:26px;}
  .brand-mark{width:42px; height:42px; flex-shrink:0;}
  .brand-mark img{width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 0 10px rgba(14,165,233,.35));}
  .brand span{font-family:'Sora',sans-serif; font-weight:700; font-size:17px;}
  h1{font-family:'Sora',sans-serif; font-size:20px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:13px; margin:0 0 22px;}
  label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  input{width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 13px;
    border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); margin-bottom:16px;}
  input:focus{outline:2px solid var(--green); outline-offset:1px;}
  button{width:100%; border:none; border-radius:10px; padding:12px; font-family:'Inter',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; color:#03130E;
    background:linear-gradient(135deg,var(--green),#00B589); box-shadow:0 8px 20px -6px rgba(0,217,163,.5);}
  button:disabled{opacity:.6; cursor:default;}
  .msg{font-size:13px; border-radius:10px; padding:11px 13px; margin-bottom:16px; display:none; line-height:1.5;}
  .msg.show{display:block;}
  .msg.err{background:rgba(255,77,106,.12); border:1px solid rgba(255,77,106,.35); color:var(--red);}
  .msg.warn{background:rgba(255,176,32,.12); border:1px solid rgba(255,176,32,.35); color:var(--amber);}
  .foot{margin-top:20px; text-align:center; font-size:12.5px; color:var(--ink-faint);}
  .foot a{color:var(--green); text-decoration:none; font-weight:600;}
  .foot a:hover{text-decoration:underline;}
  .legal{margin-top:12px; text-align:center; font-size:11.5px; color:var(--ink-faint);}
  .legal a{color:var(--green); font-weight:600; text-decoration:none;}
  .legal a:hover{text-decoration:underline;}
  a:focus-visible, button:focus-visible{outline:2px solid #06A7FA; outline-offset:2px;}
</style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="planet" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-mark"><img src="logo-mark.png?v=3" alt="Clarity Journal logo"></div>
      <span>Clarity Journal</span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Enter your username and password.</p>

    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" maxlength="128" required>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>

    <div class="foot">Don&rsquo;t have an account? <a href="/signup">Create one</a></div>
    <div class="legal"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/faq">FAQ</a></div>
  </div>

  <script>
    /* starfield: twinkling, slowly drifting stars plus the odd shooting star.
       With "reduce motion" on, the stars are drawn once and stay still. */
    (function(){
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TINTS = ['255,255,255', '255,255,255', '255,255,255', '190,215,255', '255,228,196'];
      let w = 0, h = 0, stars = [], shot = null, nextShot = performance.now() + 2500;

      function resize(){
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(w * h / 4200);
        stars = Array.from({length: count}, () => {
          const big = Math.random() < 0.07;
          return {
            x: Math.random() * w, y: Math.random() * h,
            r: big ? 1.1 + Math.random() * 0.9 : 0.3 + Math.random() * 0.8,
            a: 0.35 + Math.random() * 0.65,
            phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 1.8,
            drift: 0.015 + Math.random() * 0.06, // px per frame, bigger stars feel closer
            tint: TINTS[Math.floor(Math.random() * TINTS.length)],
          };
        });
        if(reduce) draw(0);
      }

      function draw(t){
        ctx.clearRect(0, 0, w, h);
        for(const s of stars){
          if(!reduce){ s.x -= s.drift * (s.r > 1 ? 1.8 : 1); if(s.x < -3) s.x = w + 3; }
          const alpha = reduce ? s.a : s.a * (0.6 + 0.4 * Math.sin(t / 1000 * s.speed + s.phase));
          if(s.r > 1){ // soft halo on the brighter stars
            ctx.fillStyle = `rgba(${s.tint},${alpha * 0.12})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = `rgba(${s.tint},${alpha})`;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        }
        if(reduce) return;

        if(!shot && t > nextShot){
          shot = { x: w * (0.35 + Math.random() * 0.65), y: h * Math.random() * 0.35,
                   vx: -(7 + Math.random() * 5), vy: 2.6 + Math.random() * 2.2, life: 0, max: 55 + Math.random() * 30 };
        }
        if(shot){
          shot.x += shot.vx; shot.y += shot.vy; shot.life++;
          const fade = Math.min(1, shot.life / 8) * (1 - shot.life / shot.max);
          const tail = 14;
          const grad = ctx.createLinearGradient(shot.x, shot.y, shot.x - shot.vx * tail, shot.y - shot.vy * tail);
          grad.addColorStop(0, `rgba(255,255,255,${0.95 * fade})`);
          grad.addColorStop(1, 'rgba(125,211,252,0)');
          ctx.strokeStyle = grad; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(shot.x, shot.y); ctx.lineTo(shot.x - shot.vx * tail, shot.y - shot.vy * tail); ctx.stroke();
          if(shot.life >= shot.max){ shot = null; nextShot = t + 3500 + Math.random() * 6500; }
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      if(!reduce) requestAnimationFrame(draw);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha256-WdOUh8NYmEO0EDItij1WLOAiq6HlzLFomO8/sqDaLs0=" crossorigin="anonymous"></script>
  <script src="/shared-auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    function showMsg(t,k){ msg.textContent = t; msg.className = 'msg show ' + k; }

    const state = new URLSearchParams(location.search).get('state');
    if(state === 'pending'){
      showMsg('Your account is still awaiting admin approval. You will be able to sign in once it is approved.', 'warn');
    } else if(state === 'disabled'){
      showMsg('This account has been deactivated. Contact your admin if you think this is a mistake.', 'warn');
    }

    (async () => {
      const profile = await getMyProfile();
      // already signed in: straight into the app (admins reach the admin panel from Settings)
      if(profile && profile.status === 'approved'){
        window.location.replace('/');
      }
    })();

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('submitBtn');
      const username = $('username').value.trim();
      const password = $('password').value;
      msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Signing in...';

      const fail = (text, kind) => {
        showMsg(text, kind || 'err');
        btn.disabled = false; btn.textContent = 'Sign in';
      };

      // 1. username + password -> email (Supabase authenticates by email).
      //    The server only hands back the email when the password is right, so emails stay private,
      //    and it stops answering after 10 wrong passwords for a username in 15 minutes.
      let email = null;
      try{
        const { data, error } = await sb.rpc('login_email', { p_username: username, p_password: password });
        if(error){
          if(/too_many_attempts/.test(error.message || '')) return fail('Too many failed sign-in attempts. Wait 15 minutes and try again.');
          throw error;
        }
        email = data;
      }catch(err){
        return fail('Could not reach the server. Please try again.');
      }
      // same wording for an unknown username and a wrong password, so this can't be used to discover usernames
      if(!email) return fail('Incorrect username or password.');

      // 2. sign in
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) return fail('Incorrect username or password.');

      // 3. approval gate
      const profile = await getMyProfile();
      if(!profile){ await sb.auth.signOut(); return fail('Could not load your account. Please try again.'); }
      if(profile.status === 'pending'){
        await sb.auth.signOut();
        return fail('Your account is still awaiting admin approval.', 'warn');
      }
      if(profile.status === 'disabled'){
        await sb.auth.signOut();
        return fail('This account has been deactivated.', 'warn');
      }

      window.location.replace('/');
    });
  </script>
</body>
</html>
