<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/error-log.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Clarity Journal</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Sign in to Clarity Journal, the trading journal for futures and prop firm traders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080A10; --panel:#12151C; --panel-2:#171B24; --line:rgba(125,211,252,0.5);
    --ink:#EBEDF3; --ink-soft:#8A90A3; --ink-faint:#858CA0;
    --green:#00D9A3; --red:#FF4D6A; --amber:#FFB020;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:20px;
    background:#1C1E24;}  /* plain very dark grey behind the card */

  .card{position:relative; z-index:1; width:100%; max-width:400px; border:1px solid var(--line);
    border-radius:18px; padding:34px 30px 28px;
    background:var(--panel);
    box-shadow:0 24px 60px -24px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.25);}
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:26px; color:var(--ink); text-decoration:none; width:max-content;}
  .brand-mark{width:42px; height:42px; flex-shrink:0;}
  .brand-mark img{width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 0 10px rgba(14,165,233,.35));}
  .brand span{font-family:'Sora',sans-serif; font-weight:700; font-size:17px;}
  h1{font-family:'Sora',sans-serif; font-size:20px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:13px; margin:0 0 22px;}
  label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  input{width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 13px;
    border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); margin-bottom:16px;}
  input:focus{outline:2px solid var(--green); outline-offset:1px;}
  button{width:100%; border:none; border-radius:10px; padding:12px; font-family:'Inter',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; color:#03130E;
    background:linear-gradient(135deg,var(--green),#00B589); box-shadow:0 8px 20px -6px rgba(0,217,163,.5);}
  button:disabled{opacity:.6; cursor:default;}
  .msg{font-size:13px; border-radius:10px; padding:11px 13px; margin-bottom:16px; display:none; line-height:1.5;}
  .msg.show{display:block;}
  .msg.err{background:rgba(255,77,106,.12); border:1px solid rgba(255,77,106,.35); color:var(--red);}
  .msg.warn{background:rgba(255,176,32,.12); border:1px solid rgba(255,176,32,.35); color:var(--amber);}
  .foot{margin-top:20px; text-align:center; font-size:12.5px; color:var(--ink-faint);}
  .foot a, .legal a{color:var(--green); text-decoration:none; font-weight:600;}
  .foot a:hover, .legal a:hover{text-decoration:underline;}
  .legal{margin-top:12px; text-align:center; font-size:11.5px; color:var(--ink-faint);}
  a:focus-visible, button:focus-visible{outline:2px solid #06A7FA; outline-offset:2px;}
</style>
</head>
<body>
  <div class="card" role="main">
    <a class="brand" href="/login" aria-label="Clarity Journal home">
      <div class="brand-mark"><img src="logo-mark.png?v=3" alt=""></div>
      <span>Clarity Journal</span>
    </a>

    <h1>Sign in</h1>
    <p class="sub">Enter your username and password.</p>

    <div class="msg" id="msg" role="alert"></div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" maxlength="128" required>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>

    <div class="foot">Don&rsquo;t have an account? <a href="/signup">Create one</a></div>
    <div class="legal"><a href="/login">Home</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/faq">FAQ</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha256-WdOUh8NYmEO0EDItij1WLOAiq6HlzLFomO8/sqDaLs0=" crossorigin="anonymous"></script>
  <script src="/shared-auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    function showMsg(t,k){ msg.textContent = t; msg.className = 'msg show ' + k; }

    const state = new URLSearchParams(location.search).get('state');
    if(state === 'pending'){
      showMsg('Your account is still waiting for approval. You will be able to sign in once it is approved.', 'warn');
    } else if(state === 'disabled'){
      showMsg('This account has been deactivated.', 'warn');
    }

    (async () => {
      const profile = await getMyProfile();
      // already signed in: straight into the app (admins reach the admin panel from Settings)
      if(profile && profile.status === 'approved'){
        window.location.replace('/');
      }
    })();

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('submitBtn');
      const username = $('username').value.trim();
      const password = $('password').value;
      msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Signing in...';

      const fail = (text, kind) => {
        showMsg(text, kind || 'err');
        btn.disabled = false; btn.textContent = 'Sign in';
      };

      // 1. username + password -> email (Supabase authenticates by email).
      //    The server only hands back the email when the password is right, so emails stay private,
      //    and it stops answering after 10 wrong passwords for a username in 15 minutes.
      let email = null;
      try{
        const { data, error } = await sb.rpc('login_email', { p_username: username, p_password: password });
        if(error){
          if(/too_many_attempts/.test(error.message || '')) return fail('Too many failed sign-in attempts. Wait 15 minutes and try again.');
          throw error;
        }
        email = data;
      }catch(err){
        return fail('Could not reach the server. Please try again.');
      }
      // same wording for an unknown username and a wrong password, so this can't be used to discover usernames
      if(!email) return fail('Incorrect username or password.');

      // 2. sign in
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) return fail('Incorrect username or password.');

      // 3. approval gate
      const profile = await getMyProfile();
      if(!profile){ await sb.auth.signOut(); return fail('Could not load your account. Please try again.'); }
      if(profile.status === 'pending'){
        await sb.auth.signOut();
        return fail('Your account is still waiting for approval.', 'warn');
      }
      if(profile.status === 'disabled'){
        await sb.auth.signOut();
        return fail('This account has been deactivated.', 'warn');
      }

      window.location.replace('/');
    });
  </script>
</body>
</html>
